version: 2

models:
  - name: stg_users
    description: Cleaned user records from the raw API source.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique

  - name: stg_posts
    description: Cleaned post records with calculated text lengths.
    columns:
      - name: post_id
        data_tests:
          - not_null
          - unique
      - name: user_id
        data_tests:
          - not_null