x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile

  image: airflow-dbt-etl:3.3.0

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: etl
    POSTGRES_USER: etl
    POSTGRES_PASSWORD: etl

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./etl:/opt/airflow/etl
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt
    - ./docker/airflow/init.sh:/opt/airflow/init.sh:ro

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: etl-postgres

    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-db:
    image: postgres:17
    container_name: airflow-postgres

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-apiserver:
    <<: *airflow-common

    container_name: airflow-apiserver

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  adminer:
    image: adminer
    container_name: etl-adminer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common

    container_name: airflow-dag-processor

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common

    container_name: airflow-triggerer

    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile

    container_name: etl-pipeline

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl

  airflow-init:
    <<: *airflow-common

    container_name: airflow-init

    command:
      - bash
      - /opt/airflow/init.sh

    restart: "no"

volumes:
  postgres_data:
  airflow_postgres_data:
