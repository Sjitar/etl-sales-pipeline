services:
  postgres:
    image: postgres:17

    container_name: etl-postgres

    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer

    container_name: etl-adminer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

volumes:
  postgres_data:
